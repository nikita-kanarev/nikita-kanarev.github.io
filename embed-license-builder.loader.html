<div class="fx-licb" data-fx-base="https://nikita-kanarev.github.io/" data-api-base="https://fluxetype-api.i-ec8.workers.dev" data-paddle-token="" data-paddle-env="" data-url-enterprise="" data-invoice-email="" data-url-invoice="" data-invoice-min="">
  <div data-fx-cfg hidden></div>
  <script>
  (function(){
    var root = document.currentScript.closest(".fx-licb");
    // резерв высоты: без него секция схлопнута в ноль и страница дёргается,
    // когда билдер появляется. Снимается тем же внешним файлом после вставки.
    root.style.minHeight = "620px";
    function attr(n){ var v=root.getAttribute(n); if((v==null||v==="")&&root.parentElement) v=root.parentElement.getAttribute(n); return (v==null||v==="")?"":v; }
    var src = attr("data-fx-js") || (attr("data-fx-base") + "fx-license-builder.js");
    function go(){ window.FxLicenseBuilder(root); }
    if (window.FxLicenseBuilder) return go();
    // несколько эмбедов на странице тянут ОДИН тег: второй просто ждёт его
    root.setAttribute("data-fx-wait","1");
    var s = document.querySelector("script[data-fx-licb]");
    if (!s){ s = document.createElement("script"); s.setAttribute("data-fx-licb",""); s.src = src; document.head.appendChild(s); }
    s.addEventListener("load", function(){ root.removeAttribute("data-fx-wait"); go(); });
    s.addEventListener("error", function(){
      root.style.minHeight = "";
      root.innerHTML = '<div style="font:13px ui-monospace,Menlo,monospace;color:#b00;padding:24px;border:1px dashed #b00;border-radius:8px;line-height:1.6">\u26a0 License Builder \u043d\u0435 \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u043b\u0441\u044f.<br>' + src + '</div>';
    });
  })();
  </script>
</div>
